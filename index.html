

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ميلاد منون 🎀</title>
    <style>
        body { 
            /* لمسة خفيفة: خلفية بنقاط وردية هادئة */
            background-color: #ffe4e9;
            background-image: radial-gradient(#ffb7c5 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            text-align: center; 
            color: #d63384; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            background: #fff; 
            border: 4px solid #ff69b4; 
            border-radius: 40px; 
            padding: 30px; 
            max-width: 500px; 
            margin: 0 auto; 
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3); 
        }
        .page { display: none; }
        .active { display: block; }
        button { background: #ff69b4; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-size: 16px; margin: 10px; transition: 0.3s; }
        button:hover { transform: scale(1.05); background: #ff85c1; }
        img { width: 100%; height: 250px; object-fit: cover; border-radius: 20px; margin: 10px 0; border: 3px solid #ffd1dc; }
        h1 { color: #ff69b4; }
    </style>
</head>
<body>

<div class="container">
    <div id="page1" class="page active">
        <h1>Happy Birthday Meme 🎂</h1>
        <p>يوم ميلادك الـ 17.. وما زال قلبي ينبض بك ❤️</p>
        <button onclick="showPage(2)">اللحظات الجميلة 💖</button>
    </div>

    <div id="page2" class="page">
        <h2>اللحظات الجميلة 💖</h2>
        <img src="https://i.postimg.cc/nhHCQLZS/D6E4CDDD-BF33-4012-A346-1D6A67BD369C.jpg">
        <br>
        <button onclick="showPage(1)">الرجوع 🔙</button>
        <button onclick="showPage(3)">التالي 🎶</button>
    </div>

    <div id="page3" class="page">
        <h2>For u 🎶</h2>
        <p>اضغطي على الصور للاستماع 🎧</p>
        <button onclick="showPage(2)">الرجوع 🔙</button>
        <button onclick="showPage(4)">رسالة أخيرة 💌</button>
    </div>

    <div id="page4" class="page">
        <h2>I love you 🎀</h2>
        <p>أحبك مره والله.. - عزوزك.</p>
        <button onclick="showPage(3)">الرجوع 🔙</button>
    </div>
</div>

<script>
    function showPage(n) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page' + n).classList.add('active');
        window.scrollTo(0, 0);
    }
</script>
</body>
</html>
