

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ميلاد منون 🎀</title>
    <style>
        body { background-color: #ffe4e9; font-family: sans-serif; text-align: center; color: #d63384; margin: 0; padding: 20px; }
        .container { background: #fff; border: 4px solid #ff69b4; border-radius: 40px; padding: 30px; max-width: 500px; margin: 50px auto; box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3); }
        .page { display: none; }
        .active { display: block; }
        button { background: #ff69b4; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; margin: 10px; font-size: 16px; }
        img { width: 100%; border-radius: 20px; margin: 10px 0; border: 3px solid #ffd1dc; }
    </style>
</head>
<body>
    <div class="container">
        <div id="page1" class="page active">
            <h1>Happy Birthday Meme 🎂</h1>
            <p>يوم ميلادك الـ 17.. وما زال قلبي ينبض بك ❤️</p>
            <button onclick="showPage(2)">اللحظات الجميلة 💖</button>
        </div>
        <div id="page2" class="page">
            <img src="https://i.postimg.cc/nhHCQLZS/D6E4CDDD-BF33-4012-A346-1D6A67BD369C.jpg">
            <button onclick="showPage(1)">الرجوع 🔙</button>
        </div>
    </div>
    <script>
        function showPage(n) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + n).classList.add('active');
        }
    </script>
</body>
</html>
